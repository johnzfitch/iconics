[package]
name = "iconics-tui2"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
ratatui-image = "10.0"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
anyhow = "1"
tui-tree-widget = "0.24"
chrono = "0.4"
ndarray = "0.16"
ndarray-npy = "0.9"
arboard = "3.4"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true

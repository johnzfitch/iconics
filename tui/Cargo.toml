[package]
name = "iconics-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
ratatui-image = "10.0"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
anyhow = "1"
tui-tree-widget = "0.22"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
